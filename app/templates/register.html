{% extends "base.html" %}

{% block title %}注册 - 用户流失预测系统{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', path='/js/auth.js') }}"></script>
{% endblock %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 40px auto;">
    <h2>用户注册</h2>
    <form id="register-form">
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" class="auth-input" required>
        </div>
        <div class="form-group">
            <label for="email">邮箱</label>
            <input type="email" id="email" name="email" class="auth-input" required>
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" class="auth-input" required>
        </div>
        <div class="form-group" style="margin-top: 20px;">
            <button type="submit" id="register-button">注册</button>
        </div>
        <div style="margin-top: 15px; text-align: center;">
            <p>已有账号？<a href="{{ url_for('login_page') }}">立即登录</a></p>
        </div>
    </form>
    <div id="message" style="margin-top: 15px;"></div>
</div>
{% endblock %}
