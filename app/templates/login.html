{% extends "base.html" %}

{% block title %}登录 - 用户流失预测系统{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', path='/js/auth.js') }}"></script>
{% endblock %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 40px auto;">
    <h2>用户登录</h2>
    <form id="login-form">
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" class="auth-input" required>
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" class="auth-input" required>
        </div>
        <div class="form-group" style="margin-top: 20px;">
            <button type="submit" id="login-button">登录</button>
        </div>
        <div style="margin-top: 15px; text-align: center;">
            <p>还没有账号？<a href="{{ url_for('register_page') }}">立即注册</a></p>
        </div>
    </form>
    <div id="message" style="margin-top: 15px;"></div>
</div>
{% endblock %}
