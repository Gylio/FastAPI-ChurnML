{% extends "base.html" %}

{% block title %}监控可视化 - 用户流失预测系统{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', path='/js/monitor.js') }}"></script>
{% endblock %}

{% block content %}
<div id="stats-info">
    <div class="card">
        <h3>实时统计</h3>
        <div class="form-row">
            <div class="form-group">
                <label>总请求数</label>
                <div class="result-value">0</div>
            </div>
            <div class="form-group">
                <label>成功请求数</label>
                <div class="result-value">0</div>
            </div>
            <div class="form-group">
                <label>失败请求数</label>
                <div class="result-value">0</div>
            </div>
            <div class="form-group">
                <label>模型准确率</label>
                <div class="result-value">N/A</div>
            </div>
            <div class="form-group">
                <label>平均响应时间</label>
                <div class="result-value">0ms</div>
            </div>
        </div>
    </div>
    <div class="card">
        <h3>模型版本管理</h3>
        <div class="form-row">
            <div class="form-group">
                <label for="model-version">选择模型版本</label>
                <select id="model-version"></select>
            </div>
            <div class="form-group" style="display: flex; align-items: flex-end;">
                <button id="switch-model-btn">切换模型</button>
            </div>
            <div class="form-group" id="model-status" style="display: flex; align-items: flex-end;">
                <div class="result-value">当前模型: v1</div>
            </div>
        </div>
    </div>

</div>

<div class="card">
    <h2>监控可视化</h2>
    <p>实时监控系统运行状态和模型性能。</p>
    
    <div class="chart-container" id="request-chart"></div>
</div>

<div class="card">
    <div class="chart-container" id="accuracy-chart"></div>
</div>

<div class="card">
    <div class="chart-container" id="error-chart"></div>
</div>

<div class="card">
    <h3>模型训练与EDA报告</h3>
    <p>以下报告由 <code>ml_pipeline</code> 脚本离线生成，点击可在新窗口查看。</p>
    <div class="form-row">
        <div class="form-group">
            <button type="button" onclick="window.open('/ml-reports/eda_report.html', '_blank')">
                查看EDA报告
            </button>
        </div>
        <div class="form-group">
            <button type="button" onclick="window.open('/ml-reports/numeric_features.png', '_blank')">
                数值特征分布
            </button>
        </div>
        <div class="form-group">
            <button type="button" onclick="window.open('/ml-reports/correlation_heatmap.png', '_blank')">
                特征相关性热力图
            </button>
        </div>
        <div class="form-group">
            <button type="button" onclick="window.open('/ml-reports/model_comparison.png', '_blank')">
                模型性能对比
            </button>
        </div>
    </div>
</div>
{% endblock %}
